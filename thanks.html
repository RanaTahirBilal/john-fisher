<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | John W. Fisher</title>
<meta name="robots" content="noindex">
<link href="vendor/img/favicon.ico" rel="icon">
<style>
  :root{ --ink:#1C2A39; --soft:#54657A; --sea:#1F5F8B; --sand:#F7F4EE; --line:#E3DED4; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--sand);color:var(--soft);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:28px;line-height:1.7}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:48px 40px;max-width:520px;text-align:center;
        box-shadow:0 18px 44px rgba(28,42,57,.10)}
  h1{color:var(--ink);font-size:28px;margin:0 0 14px}
  p{margin:0 0 26px;font-size:16px}
  a.back{display:inline-block;background:var(--sea);color:#fff;text-decoration:none;
         padding:14px 30px;border-radius:6px;font-size:15px;min-height:44px}
  a.back:hover{background:#164A6D}
  a.back:focus-visible{box-shadow:0 0 0 3px var(--sand),0 0 0 6px var(--sea);outline:none}
</style>
</head>
<body>
  <main class="card">
    <h1>Message sent</h1>
    <p>Thank you for writing. John reads everything that comes through this form
       and will get back to you.</p>
    <a class="back" href="./">Back to the site</a>
  </main>
</body>
</html>
